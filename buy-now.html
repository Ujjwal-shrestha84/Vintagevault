<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Review | Vintage Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    .order-box {
      background: #fff;
      padding: 25px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .price {
      font-weight: bold;
      color: #198754;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light bg-light px-4">
  <a class="navbar-brand fw-bold" href="index.html">Vintage Vault</a>
</nav>

<!-- ORDER REVIEW -->
<div class="container my-5">
  <div class="order-box">

    <h4 class="mb-4">Order Review</h4>

    <div id="order-items"></div>

    <hr>

    <div class="d-flex justify-content-between">
      <h5>Total</h5>
      <h5 id="total-price">$0</h5>
    </div>

    <button class="btn btn-dark w-100 mt-4" onclick="placeOrder()">
      Place Order
    </button>

  </div>
</div>

<script>
function getOrder() {
  return JSON.parse(localStorage.getItem("checkout")) || [];
}

function displayOrder() {
  const order = getOrder();
  const box = document.getElementById("order-items");
  const totalBox = document.getElementById("total-price");

  let total = 0;
  box.innerHTML = "";

  order.forEach(item => {
    total += item.price * item.qty;

    box.innerHTML += `
      <div class="d-flex align-items-center mb-3">
        <img src="${item.image}" width="80" class="me-3">
        <div>
          <h6 class="mb-1">${item.name}</h6>
          <p class="mb-0">Qty: ${item.qty}</p>
          <p class="price">$${(item.price * item.qty).toFixed(2)}</p>
        </div>
      </div>
    `;
  });

  totalBox.innerText = "$" + total.toFixed(2);
}

function placeOrder() {
  alert("Order placed successfully!");
  localStorage.removeItem("checkout");
  window.location.href = "order-success.html";
}

displayOrder();
</script>

<!-- FOOTER -->
<footer class="text-center py-3 text-muted">
  © 2026 Vintage Vault
</footer>

</body>
</html>
