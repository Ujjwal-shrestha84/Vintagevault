<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Vintage Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light bg-light px-4">
  <a class="navbar-brand fw-bold" href="index.html">Vintage Vault</a>
</nav>

<!-- LOGIN FORM -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-4 login-box">

    <h4 class="mb-4 text-center">Login to Your Account</h4>

    <input type="email" class="form-control mb-3" placeholder="Email address" required>

    <input type="password" class="form-control mb-3" placeholder="Password" required>

    <button class="btn btn-dark w-100 mb-3" onclick="loginUser()">
      Login
    </button>

    <p class="text-center text-muted mb-0">
      Don’t have an account? <a href="#">Create one</a>
    </p>

  </div>
</div>

<script>
function loginUser() {
  // Demo login
  alert("Login successful!");
  window.location.href = "index.html";
}
</script>

<!-- FOOTER -->
<footer class="text-center py-3 text-muted">
  © 2026 Vintage Vault
</footer>

</body>
</html>
