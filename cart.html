<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Cart | Vintage Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    .cart-box {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .cart-item img {
      width: 80px;
      height: auto;
    }
    .price {
      font-weight: bold;
      color: hsl(22, 78%, 25%);
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light bg-light px-4">
  <a class="navbar-brand fw-bold" href="index.html">Vintage Vault</a>
  <a href="index.html" class="btn btn-outline-dark">Continue Shopping</a>
</nav>

<!-- CART -->
<div class="container my-5">
  <div class="cart-box">

    <h3 class="mb-4">🛒 My Cart</h3>

    <div id="cart-items"></div>

    <hr>

    <div class="d-flex justify-content-between align-items-center">
      <h5>Total:</h5>
      <h5 class="price" id="total-price">$0</h5>
    </div>

    <button class="btn btn-dark w-100 mt-3">Proceed to Checkout</button>

  </div>
</div>

<script>
  function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
  }

  function saveCart(cart) {
    localStorage.setItem("cart", JSON.stringify(cart));
    displayCart();
  }

  function removeItem(index) {
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
  }

  function displayCart() {
    const cart = getCart();
    const cartItems = document.getElementById("cart-items");
    const totalPrice = document.getElementById("total-price");

    cartItems.innerHTML = "";
    let total = 0;

    if (cart.length === 0) {
      cartItems.innerHTML = "<p class='text-muted'>Your cart is empty.</p>";
      totalPrice.innerText = "$0";
      return;
    }

    cart.forEach((item, index) => {
      total += item.price;

      cartItems.innerHTML += `
        <div class="cart-item d-flex align-items-center justify-content-between mb-3">
          <div class="d-flex align-items-center gap-3">
            <img src="${item.image}" alt="${item.name}">
            <div>
              <h6 class="mb-1">${item.name}</h6>
              <p class="price mb-0">$${item.price}</p>
            </div>
          </div>
          <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">
            Remove
          </button>
        </div>
      `;
    });

    totalPrice.innerText = "$" + total.toFixed(2);
  }

  displayCart();
</script>

<!-- FOOTER -->
<footer class="text-center py-3 text-muted">
  © 2026 Vintage Vault, Shrestha Ujjwal
</footer>

</body>
</html>
